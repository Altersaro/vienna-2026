<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vienna">
<meta name="robots" content="noindex">
<title>Vienna · 23–27 novembre</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
<style>
:root{
  --navy:#1C2233; --navy2:#2A3146; --cream:#F5EFE4; --card:#FBF8F2; --line:#E6DCC8;
  --gold:#D4AF5F; --gold-d:#8A6A22; --ink:#1C2233; --muted:#4A5060; --muted2:#6A6F7C;
  --c-viaggio:#2F5C8A; --c-visita:#8A6A22; --c-cibo:#9A4A1E; --c-serata:#8E2A2A; --ok:#2F6B3A;
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
/* Sfondo della pagina blu: iOS lo usa per la sfumatura sotto la barra di stato. */
html{background:var(--navy)}
body{background:var(--cream)}
body{min-height:100vh;min-height:100dvh}
a{color:var(--gold-d)}
button{font:inherit}
img{display:block;max-width:100%}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--cream)}
main{flex:1;padding-bottom:calc(84px + var(--safe-b))}
main:has(.home){background:var(--navy)}
.hdr{background:var(--navy);color:var(--cream);padding:calc(18px + var(--safe-t)) 18px 14px;display:flex;flex-direction:column;gap:12px}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kicker{margin:0;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700}
.h1{margin:4px 0 0;font-family:var(--serif);font-size:26px;line-height:1.15;font-weight:700}
.round{flex:none;width:44px;height:44px;border-radius:22px;background:var(--navy2);display:flex;align-items:center;justify-content:center;color:var(--gold);text-decoration:none}
.chips{display:flex;gap:6px}
.chip{flex:1;min-height:52px;border:none;border-radius:12px;background:var(--navy2);color:#E6E0D4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 0}
.chip span{font-size:11px;font-weight:700;letter-spacing:1px}
.chip b{font-size:18px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
.content{padding:16px;display:flex;flex-direction:column;gap:10px}
.alert{background:#FBF3DC;border:1px solid #E3CF96;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;color:#5C4610}
.toggle{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.toggle button{flex:1;min-height:44px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
.step{display:flex;gap:12px}
.step-time{width:48px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:14px}
.step-time b{font-size:13px}
.dot{width:10px;height:10px;border-radius:5px}
.card{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#E6DCC8}
.kind{margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.card h2,.card h3{margin:0;font-size:16px;line-height:1.3;font-weight:700}
.note{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.extra{margin:0;display:flex;flex-direction:column;gap:6px}
.extra img{width:100%;aspect-ratio:3/2;height:auto;object-fit:cover;border-radius:12px}
.extra figcaption{font-size:13px;color:var(--muted)}
.how{border:1px solid var(--line);border-radius:12px;background:#fff}
.how summary{list-style:none;cursor:pointer;min-height:44px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--c-viaggio)}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:'+';margin-left:auto;font-size:18px}
.how[open] summary::after{content:'–'}
.how ol{margin:0;padding:0 12px 12px;list-style:none;display:flex;flex-direction:column;gap:10px}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.how .line{flex:none;min-width:44px;padding:3px 6px;border-radius:6px;color:#fff;font-size:12px;font-weight:700;text-align:center}
.how small{display:block;color:var(--muted);font-size:13px}
.desc{margin:0;padding-left:10px;border-left:3px solid var(--gold);font-size:14px;line-height:1.5;color:var(--ink)}
.btn{align-self:flex-start;min-height:44px;padding:0 16px;border-radius:22px;background:var(--navy);color:var(--cream);font-size:14px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer}
.btn svg{flex:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price{flex:none;font-size:15px;font-weight:700;color:var(--c-cibo)}
.meta{font-size:12px;font-weight:700;color:var(--gold-d);letter-spacing:.5px}
.linkcard{background:var(--navy);color:var(--cream);border-radius:14px;padding:14px 16px;text-decoration:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.linkcard small{display:block;color:#C9CDD8;font-size:12px;margin-top:2px}
.small{margin:0;font-size:12px;line-height:1.45;color:#5A6070}
/* home */
/* la home occupa esattamente lo schermo sopra la barra in basso: niente scroll, la foto si adatta */
.home{background:var(--navy);color:var(--cream);position:relative;overflow:hidden;height:calc(100vh - 84px - var(--safe-b));height:calc(100dvh - 84px - var(--safe-b))}
.home-inner{position:relative;height:100%;padding:calc(18px + var(--safe-t)) 18px 12px;display:flex;flex-direction:column;gap:12px}
.home h1{margin:0;font-family:var(--serif);font-size:46px;line-height:1;font-weight:700}
.home .sub{margin:2px 0 0;font-family:var(--serif);font-style:italic;font-size:17px;color:#DCD6CA}
.today{flex:1;min-height:0;background:var(--cream);color:var(--ink);border-radius:20px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:9px}
.today img{width:100%;flex:1 1 0;min-height:0;max-height:260px;object-fit:cover;border-radius:14px}
.badge{background:var(--navy);color:var(--gold);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:700}
.today h2{margin:0;font-family:var(--serif);font-size:23px;line-height:1.15}
.tops{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:9px}
.tops div{display:flex;gap:12px;align-items:baseline;font-size:14px;line-height:1.3}
.tops span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tops b{width:44px;flex:none;font-size:13px;color:var(--gold-d)}
.cta{flex:none;min-height:50px;border-radius:25px;background:var(--navy);color:var(--cream);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700}
.quick{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick a,.quick button{border:none;font:inherit;cursor:pointer;min-height:60px;border-radius:16px;background:var(--navy2);color:var(--cream);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;text-align:center}
/* Safari con le barre aperte (iPhone 14/15 ≈ 660 px utili): tolgo il superfluo per lasciare spazio alla foto */
@media (max-height:720px){.home .sub,.tops div:nth-child(3){display:none}.home h1{font-size:40px}}
.ext{display:inline-flex;align-items:center;gap:6px;min-height:36px;font-size:14px;font-weight:700;color:var(--gold-d)}
/* abbonamenti */
.qr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.qr h3{margin:0;font-size:16px;align-self:flex-start}
.qr img{width:100%;max-width:340px;aspect-ratio:1/1;object-fit:contain;background:#fff;cursor:zoom-in}
.qr .empty{width:100%;max-width:340px;aspect-ratio:1/1;border:2px dashed #B9AE98;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--muted);font-size:14px;padding:16px}
.qr .acts{display:flex;gap:10px;flex-wrap:wrap;align-self:stretch;align-items:center}
.qr .lnk{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px;min-height:44px;cursor:pointer;padding:0 6px}
.zoom{position:fixed;inset:0;z-index:20;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;cursor:zoom-out}
.zoom img{width:100%;max-width:min(92vw,80vh);aspect-ratio:1/1;object-fit:contain}
.zoom p{margin:0;font-size:16px;font-weight:700;color:var(--ink)}
.zoom small{color:var(--muted)}
/* portafoglio, spese, frasi */
.field{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.linkbtn{width:100%;border:none;cursor:pointer;font:inherit;text-align:left}
.zoom .big{font-family:var(--serif);font-size:30px;line-height:1.25;text-align:center}
.phr{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:52px}
.phr b{font-size:16px;line-height:1.3}
.phr span{font-size:13px;color:var(--muted)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sum div{background:var(--navy2);border-radius:12px;padding:8px 10px;color:var(--cream);font-size:12px}
.sum b{display:block;font-size:17px;color:var(--gold)}
/* conversazioni e scelta giorno */
.dlg{display:flex;flex-direction:column;gap:8px;padding:0 12px 12px}
.dlg .who{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);margin:2px 0 -4px}
.say{max-width:90%;border-radius:14px;padding:9px 12px;font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px}
.say b{font-size:15px;line-height:1.35}
.say span{font-size:13px;opacity:.8}
.say.me{align-self:flex-end;background:var(--navy);color:var(--cream);border:none;cursor:pointer}
.say.them{align-self:flex-start;background:#fff;border:1px solid var(--line);color:var(--ink)}
.pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.pick button{min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0}
.pick button span{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted)}
.pick button b{font-size:17px}
.pick button.all{grid-column:1/-1;min-height:44px;flex-direction:row;font-weight:700;font-size:14px}
.pick button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.pick button[aria-pressed="true"] span{color:var(--gold)}
.fab{position:fixed;right:14px;bottom:calc(92px + var(--safe-b));z-index:6;min-height:48px;padding:0 16px;border-radius:24px;border:none;background:var(--gold);color:var(--navy);font:inherit;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.fab[hidden]{display:none}
.crisp{image-rendering:-webkit-optimize-contrast;image-rendering:pixelated}
.thumb{width:56px;height:56px;flex:none;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.thumb.pdf{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.linkcard.light{background:#fff;color:var(--ink);border:1px solid var(--line);justify-content:flex-start}
.linkcard.light small{color:var(--muted)}
.linkcard.light>span{flex:1;min-width:0}
.tinfo{width:100%;border-radius:12px;border:1px solid var(--line);background:#fff}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(10px + var(--safe-b))}
/* Se iOS solleva la barra fissa, copre lo spazio rimasto sotto. */
nav.tabs::after{content:'';position:absolute;left:0;right:0;top:100%;height:200px;background:var(--card)}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs a{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted2);font-size:11px;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700}
.sec{margin:6px 0 0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.info p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <main id="view" tabindex="-1"></main>
  <nav class="tabs" aria-label="Sezioni"><div class="in" id="tabs"></div></nav>
  <button class="fab" id="fab" type="button" data-passes hidden aria-label="Mostra gli abbonamenti dei mezzi">QR Abbonamenti</button>
</div>

<script>
// ---------- Dati del viaggio (verificati il 27–28/10/2026) ----------
const HOTEL = 'Albertgasse 48, 1080 Wien';
const COLORS = { viaggio: 'var(--c-viaggio)', visita: 'var(--c-visita)', cibo: 'var(--c-cibo)', serata: 'var(--c-serata)' };
const KIND = { viaggio: 'Spostamento', visita: 'Da vedere', cibo: 'Mangiare', serata: 'Sera' };

// s(ora, tipo, titolo, nota, destinazione per Maps, modo, foto, etichetta pulsante)
const s = (time, kind, title, note, dest, mode, img, label) => ({ time, kind, title, note, dest, mode: mode || 'transit', img, label });
// aggiunge a una tappa una breve descrizione storica (chiese e monumenti)
const about = (step, desc) => Object.assign(step, { desc });
// linee e fermate con i nomi ufficiali (Wiener Linien, ÖBB): leg(linea, da, a, dettagli)
const leg = (line, from, to, extra) => ({ line, from, to, extra });
const ride = (step, ...how) => Object.assign(step, { how });
// seconda foto di riferimento (es. il mercatino accanto al monumento)
const photo = (step, img, caption) => Object.assign(step, { more: { img, caption } });
const HOTEL_WALK = leg('A piedi', 'Alser Straße', 'Hotel Korotan', 'Circa 6 min lungo la Alser Straße e l’Albertgasse.');

const DAYS = [
  { n: 1, short: 'LUN', num: '23', label: 'Giorno 1 · lunedì 23 novembre', title: 'Arrivo e mercatino del Rathaus', heroImg: 'stephansdom',
    alert: 'Promemoria: compra il biglietto della tratta aeroporto (≈2,30 €).',
    steps: [
      ride(s('11:40', 'viaggio', 'Dall’aeroporto all’hotel', 'Atterraggio a Vienna (VIE). REX 7 fino a Meidling, poi U6. Non prendete la S7: per i lavori arriva solo a St. Marx.', HOTEL, 'transit', 'aeroporto', 'Verso l’hotel'),
        leg('REX 7', 'Flughafen Wien', 'Wien Meidling', 'Direzione Mödling, 31 min. Esempio: partenza 12:16, arrivo 12:47. Vanno bene anche Railjet e IC per Meidling.'),
        leg('U6', 'Bahnhof Meidling', 'Alser Straße', 'Direzione Floridsdorf, 8 fermate.'),
        HOTEL_WALK),
      s('13:00', 'visita', 'Hotel Korotan: check-in o bagagli', HOTEL),
      s('13:30', 'cibo', 'Pranzo: Prinz Ferdinand', 'Mittagsmenü a 4 min a piedi. Schnitzel con zuppa ≈14,90 €.', 'Bennoplatz 2, 1080 Wien', 'walking', 'schnitzel'),
      ride(photo(about(s('15:00', 'visita', 'Stephansdom → Graben → Kohlmarkt → MQ', 'Tram 43 + bus 1A fino a Stephansplatz, poi tutto a piedi. Navata del Duomo gratis. Sulla piazza c’è già il mercatino Weihnachtsdorf Stephansplatz (11–21): artigianato austriaco e specialità tradizionali.', 'Stephansplatz, 1010 Wien', 'transit', 'stephansdom'),
        'Il Duomo di Santo Stefano è il simbolo di Vienna. È gotico, con la torre sud alta circa 136 m: in cima si arriva con 343 gradini. Le tegole colorate del tetto disegnano l’aquila bicipite degli Asburgo e gli stemmi di Vienna e dell’Austria. Nella torre nord c’è la Pummerin, la grande campana rifusa dopo l’incendio del 1945.'), 'mercatino-stephansplatz', 'Il mercatino Weihnachtsdorf Stephansplatz, accanto al Duomo'),
        leg('43', 'Skodagasse', 'Schottentor', 'Fermata sulla Alser Straße, 4 min dall’hotel. Direzione Schottentor, 3 fermate fino al capolinea.'),
        leg('1A', 'Schottentor', 'Stephansplatz', 'Direzione Stephansplatz, 7 fermate. Passa da Michaelerplatz e Graben.')),
      ride(s('19:00', 'serata', 'Christkindlmarkt al Rathausplatz', 'Cena tra le bancarelle: gulasch, salsicce, punch.', 'Rathausplatz, 1010 Wien', 'walking', 'rathaus'),
        leg('2', 'Rathaus', 'Albertgasse', 'Per tornare in hotel: direzione Dornbach, 2 fermate, poi 7 min a piedi.'))
    ]},
  { n: 2, short: 'MAR', num: '24', label: 'Giorno 2 · martedì 24 novembre', title: 'Sissi, Parlamento e Figlmüller', heroImg: 'belvedere',
    alert: 'Prenotati: Belvedere alle 16:00 · tavolo Figlmüller alle 21:30.',
    steps: [
      ride(s('10:00', 'visita', 'Hofburg: Sisi Museum e Appartamenti', 'Tram 2 fino a Burgring, poi 8 min a piedi attraverso l’Heldenplatz. Incluso nel Sisi Pass.', 'Sisi Museum, Michaelerplatz, 1010 Wien', 'transit', 'appartamenti'),
        leg('2', 'Albertgasse', 'Burgring', 'Fermata sulla Josefstädter Straße, 7 min dall’hotel. Direzione Friedrich-Engels-Platz, 4 fermate.'),
        leg('A piedi', 'Burgring', 'Michaelerplatz', 'Circa 8 min attraverso l’Heldenplatz e i cortili della Hofburg.')),
      s('13:00', 'cibo', 'Pranzo al Justizcafé', 'Ultimo piano del Palazzo di Giustizia, 14 min a piedi. Controllo di sicurezza, cucina 11–14:30.', 'Schmerlingplatz 11, 1010 Wien', 'walking', 'justiz'),
      s('14:00', 'visita', 'Parlamento, visita gratuita', '7 min a piedi. Serve un documento con foto.', 'Parlament, Dr.-Karl-Renner-Ring 3, 1010 Wien', 'walking', 'parlament'),
      ride(s('15:00', 'cibo', 'Caffè storico: Sacher o Demel', 'In tram dal Parlamento all’Opera.', 'Café Sacher, Philharmoniker Straße 4, 1010 Wien', 'transit', 'sachertorte'),
        leg('1 · 2 · D', 'Parlament, Volkstheater', 'Oper, Karlsplatz', 'Va bene uno qualsiasi di questi tram, 2 fermate. Il Sacher è dietro l’Opera.')),
      ride(s('16:00', 'visita', 'Belvedere Superiore · slot 16:00', 'Tram D fino a Schloss Belvedere. Il Bacio di Klimt. Chiude alle 18.', 'Oberes Belvedere, Prinz-Eugen-Straße 27, 1030 Wien', 'transit', 'belvedere'),
        leg('D', 'Oper, Karlsplatz', 'Schloss Belvedere', 'Direzione Absberggasse, 4 fermate. L’ingresso del museo è lì davanti.')),
      s('17:30', 'serata', 'Mercatino di Schwarzenbergplatz', 'È sulla strada a piedi dal Belvedere verso Karlsplatz: una sosta di 30 min. Controlla gli orari di apertura prima di andare.', 'Schwarzenbergplatz, 1030 Wien', 'walking'),
      photo(about(s('18:30', 'serata', 'Karlskirche e mercatino Art Advent', '18 min a piedi, in discesa nei giardini.', 'Karlsplatz, 1040 Wien', 'walking', 'karlskirche'),
        'La chiesa di San Carlo Borromeo è un capolavoro del barocco viennese. Nel 1713, durante l’ultima grande peste, l’imperatore Carlo VI promise di costruirla. La progettò Fischer von Erlach. Davanti alla facciata ci sono due colonne con scene della vita del santo, e la cupola è affrescata da Rottmayr. Di solito chiude alle 18 (ingresso 9,50 €): la sera resta il mercatino sulla piazza.'), 'mercatino-karlsplatz', 'Il mercatino Art Advent davanti alla Karlskirche'),

// Giorno del viaggio in base alla data (ora di Vienna): 0 = prima, 1–5 = durante, 6 = dopo
function tripDay() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Vienna', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  if (parts < '2026-11-23') return 0;
  if (parts > '2026-11-27') return 6;
  return Number(parts.slice(8, 10)) - 22;
}
function daysLeft() {
  const now = new Date(); const start = new Date('2026-11-23T00:00:00+01:00');
  return Math.max(0, Math.ceil((start - now) / 86400000));
}
const defaultDay = () => { const t = tripDay(); return t === 0 ? 1 : t === 6 ? 1 : t; };

function header(kicker, title, extra) {
  return `<header class="hdr"><div class="hdr-row"><div><p class="kicker">${esc(kicker)}</p><h1 class="h1">${esc(title)}</h1></div>
    <a class="round" href="${maps(HOTEL, 'transit')}" aria-label="Torna in hotel">${ICON.house}</a></div>${extra || ''}</header>`;
}
function chips(route, active) {
  return `<div class="chips" role="group" aria-label="Giorno">${DAYS.map((d) =>
    `<button class="chip" type="button" data-go="#/${route}/${d.n}" aria-pressed="${d.n === active}"><span>${d.short}</span><b>${d.num}</b></button>`).join('')}</div>`;
}
// colori ufficiali delle metro di Vienna; tram rossi, bus blu, treni grigio scuro, piedi oro
function lineColor(l) {
  const u = { U1: '#E3000F', U2: '#A862A4', U3: '#EE7D00', U4: '#319F49', U6: '#9D6930' };
  if (u[l]) return u[l];
  if (/^[\dD ·]+$/.test(l)) return '#C4161C';
  if (/A$|^Bus/.test(l)) return '#1F5FA8';
  if (l === 'A piedi') return 'var(--gold-d)';
  return '#3A3F4D';
}
function stepHtml(st) {
  const col = COLORS[st.kind];
  return `<div class="step"><div class="step-time"><b>${esc(st.time)}</b><span class="dot" style="background:${col}"></span></div>
    <article class="card">
      ${st.img ? `<img src="img/${st.img}.jpg" alt="${esc(st.title)}" loading="lazy" width="900" height="600">` : ''}
      <p class="kind" style="color:${col}">${KIND[st.kind]}</p>
      <h2>${esc(st.title)}</h2>
      ${st.note ? `<p class="note">${esc(st.note)}</p>` : ''}
      ${st.desc ? `<p class="desc">${esc(st.desc)}</p>` : ''}
      ${st.more ? `<figure class="extra"><img src="img/${st.more.img}.jpg" alt="${esc(st.more.caption)}" loading="lazy" width="900" height="600"><figcaption>${esc(st.more.caption)}</figcaption></figure>` : ''}
      ${st.how ? `<details class="how"><summary>${ICON.info}Linee e fermate</summary><ol>${st.how.map((g) => `<li>
        <span class="line" style="background:${lineColor(g.line)}">${esc(g.line)}</span>

      ${st.dest ? `<a class="btn" href="${maps(st.dest, st.mode)}" target="_blank" rel="noopener">${ICON.pin}${esc(st.label || (st.mode === 'walking' ? 'A piedi, portami lì' : 'Mezzi, portami lì'))}</a>` : ''}
    </article></div>`;
}

const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
function loadPdfJs() {

// il codice è il blocco scuro, denso e quasi quadrato della pagina
function findCode(lum, W, H) {
  const c = Math.max(6, Math.round(W / 200)), gw = Math.ceil(W / c), gh = Math.ceil(H / c);
  const act = new Uint8Array(gw * gh);
  for (let gy = 0; gy < gh; gy++) for (let gx = 0; gx < gw; gx++) {
    let d = 0, n = 0;
    for (let y = gy * c; y < Math.min(H, gy * c + c); y++) for (let x = gx * c; x < Math.min(W, gx * c + c); x++) { n++; if (lum[y * W + x] < 110) d++; }
    if (d / n > 0.2) act[gy * gw + gx] = 1;
  }
  const seen = new Uint8Array(gw * gh); let best = null;
  for (let i = 0; i < act.length; i++) {
    if (!act[i] || seen[i]) continue;
    const st = [i]; seen[i] = 1; let cnt = 0, x0 = gw, y0 = gh, x1 = 0, y1 = 0;
    while (st.length) {
      const k = st.pop(), x = k % gw, y = (k / gw) | 0; cnt++;
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= gw || ny >= gh) continue; const j = ny * gw + nx; if (act[j] && !seen[j]) { seen[j] = 1; st.push(j); } }
    }
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1, fill = cnt / (bw * bh), ar = bw / bh;
    if (bw >= 8 && bh >= 8 && fill > 0.6 && ar > 0.7 && ar < 1.43 && (!best || cnt > best.cnt)) best = { cnt, x0, y0, x1, y1 };
  }
  if (!best) return null;
  let X0 = W, Y0 = H, X1 = 0, Y1 = 0;
  const ax0 = Math.max(0, (best.x0 - 1) * c), ay0 = Math.max(0, (best.y0 - 1) * c), ax1 = Math.min(W, (best.x1 + 2) * c), ay1 = Math.min(H, (best.y1 + 2) * c);
  for (let y = ay0; y < ay1; y++) for (let x = ax0; x < ax1; x++) if (lum[y * W + x] < 110) { if (x < X0) X0 = x; if (x > X1) X1 = x; if (y < Y0) Y0 = y; if (y > Y1) Y1 = y; }
  return { x: X0, y: Y0, w: X1 - X0 + 1, h: Y1 - Y0 + 1 };

const cvBlob = (cv, type, q) => new Promise((r) => cv.toBlob(r, type, q));
// ritaglia codice e dati da un'immagine già disegnata su canvas e salva il biglietto
async function saveFromCanvas(cv, label, day, pdf, idx, requireCode) {

  for (let k = 0; k < W * H; k++) lum[k] = (px[4 * k] * 0.299 + px[4 * k + 1] * 0.587 + px[4 * k + 2] * 0.114) | 0;
  const code = findCode(lum, W, H);
  if (!code && requireCode) return false;
  let X0 = W, Y0 = H, X1 = 0, Y1 = 0;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (lum[y * W + x] < 240) { if (x < X0) X0 = x; if (x > X1) X1 = x; if (y < Y0) Y0 = y; if (y > Y1) Y1 = y; }
  if (X1 <= X0 || Y1 <= Y0) return false;
  const m = 16, iw = X1 - X0 + 1 + 2 * m, ih = Y1 - Y0 + 1 + 2 * m;
  const ic = document.createElement('canvas'); ic.width = iw; ic.height = ih;
  const ictx = ic.getContext('2d'); ictx.fillStyle = '#fff'; ictx.fillRect(0, 0, iw, ih); ictx.drawImage(cv, X0, Y0, iw - 2 * m, ih - 2 * m, m, m, iw - 2 * m, ih - 2 * m);
  const infoBlob = await cvBlob(ic, 'image/jpeg', 0.92); let qrBlob = null;
  if (code) {
    const qm = Math.round(code.w * 0.08), qw = code.w + 2 * qm, qh = code.h + 2 * qm;
    const qc = document.createElement('canvas'); qc.width = qw; qc.height = qh;
    const qctx = qc.getContext('2d'); const out = qctx.createImageData(qw, qh); out.data.fill(255);
    for (let y = 0; y < code.h; y++) for (let x = 0; x < code.w; x++) { const v = lum[(code.y + y) * W + code.x + x] < 140 ? 0 : 255, t = 4 * ((y + qm) * qw + x + qm); out.data[t] = out.data[t + 1] = out.data[t + 2] = v; }
    qctx.putImageData(out, 0, 0); qrBlob = await cvBlob(qc, 'image/png');
  }
  const rec = { blob: qrBlob || infoBlob, info: qrBlob ? infoBlob : null, label, day, created: Date.now() + idx };
  if (pdf) rec.pdf = pdf;
  await qrSet('w-' + Date.now() + '-' + idx, rec);
  return true;
}

async function importImage(file, label, day) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('immagine non leggibile')); im.src = url; });
    const k = Math.min(1, 2400 / img.naturalWidth), cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    const ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);

}
async function importPdf(file, name, day, say) {
  say('Apro il PDF…');

  const doc = await lib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  for (let i = 1; i <= doc.numPages; i++) {
    say(`Leggo la pagina ${i} di ${doc.numPages}…`);
    const pg = await doc.getPage(i), v0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: 2400 / v0.width });
    const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);

    await pg.render({ canvasContext: ctx, viewport: vp }).promise;

  }
}

    : `<p class="small">Tocca una frase: si apre a schermo intero, da mostrare o leggere. Sotto c’è il significato in italiano.</p>
    ${PHRASES.map((g, i) => `<p class="sec">${esc(g.title)}</p>` + g.items.map(([en, it], j) => `<button class="phr" type="button" data-phrase="${i}-${j}"><b>${esc(en)}</b><span>${esc(it)}</span></button>`).join('')).join('')}`;
  return header('Frasi utili', conv ? 'Conversazioni in inglese' : 'Da mostrare in inglese') + `<div class="content">${toggle}${body}</div>`;
}

// ---------- Router ----------
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');
function route() {
  const [, name, arg] = (location.hash || '#/').split('/');
  const n = Math.min(5, Math.max(1, Number(arg) || defaultDay()));
  let html, tab;
  if (name === 'giorno') { html = viewDay(n); tab = 'giorno'; }
  else if (name === 'mangiare') { html = viewFood(n); tab = 'mangiare'; }
  else if (name === 'portafoglio') { html = viewWallet(); tab = 'portafoglio'; }
  else if (name === 'biglietto') { html = viewTicket(); tab = 'portafoglio'; }
  else if (name === 'spese') { html = viewExpenses(); tab = 'info'; }
  else if (name === 'frasi') { html = viewPhrases(arg); tab = 'info'; }
  else if (name === 'itinerari') { html = viewRoutes(); tab = 'itinerari'; }
  else if (name === 'info') { html = viewInfo(); tab = 'info'; }
  else { html = viewHome(); tab = 'home'; }
  document.body.style.background = tab === 'home' ? 'var(--navy)' : 'var(--cream)';
  view.innerHTML = html;
  const fab = document.getElementById('fab'); if (fab) fab.hidden = tab === 'home' || (tab === 'portafoglio' && name !== 'biglietto');
  if (name === 'biglietto') hydrateTicket(decodeURIComponent(arg || ''));
  else if (tab === 'portafoglio') hydrateWallet();
  if (tab === 'giorno') hydrateDayWallet(n);
  const items = [['home', '#/', 'Inizio', ICON.tabHome], ['giorno', `#/giorno/${n}`, 'Giorno', ICON.tabDay], ['mangiare', `#/mangiare/${n}`, 'Mangiare', ICON.tabFood], ['itinerari', '#/itinerari', 'Itinerari', ICON.tabRoute], ['portafoglio', '#/portafoglio', 'Portafoglio', ICON.tabQr], ['info', '#/info', 'Altro', ICON.tabInfo]];
  tabs.innerHTML = items.map(([id, href, label, ic]) => `<a href="${href}"${id === tab ? ' aria-current="page"' : ''}>${ic}${label}</a>`).join('');
}
document.addEventListener('click', async (e) => {
  const z = e.target.closest('[data-zoom]'); if (z) { showZoom(z.dataset.src || z.src, z.dataset.zoom, !!z.dataset.crisp); return; }
  if (e.target.closest('[data-passes]')) { showPasses(); return; }
  const wd = e.target.closest('[data-wday]');
  if (wd) { const box = document.getElementById('w-days'); box.dataset.val = wd.dataset.wday; box.querySelectorAll('[data-wday]').forEach((b) => b.setAttribute('aria-pressed', String(b === wd))); return; }
  const cv = e.target.closest('[data-convo]'); if (cv) { const [i, j] = cv.dataset.convo.split('-'); const x = CONVOS[i].lines[j]; showText(x[1], x[2]); return; }
  const ph = e.target.closest('[data-phrase]'); if (ph) { const [i, j] = ph.dataset.phrase.split('-'); const x = PHRASES[i].items[j]; showText(x[0], x[1]); return; }
  const rm = e.target.closest('[data-remove]');
  if (rm) { if (confirm('Rimuovere questo file dal telefono?')) { await qrDel(rm.dataset.remove); location.hash = '#/portafoglio'; } return; }
  const rn = e.target.closest('[data-rename]');
  if (rn) { const h1 = document.querySelector('.h1'); const n = prompt('Nome', h1 ? h1.textContent : ''); if (n && n.trim()) { const L = store.get('labels', {}); L[rn.dataset.rename] = n.trim(); store.set('labels', L); route(); } return; }
  if (e.target.closest('[data-addexp]')) {
    const amt = Number(String(document.getElementById('e-amt').value).replace(',', '.'));
    if (!(amt > 0)) { document.getElementById('e-amt').focus(); return; }
    const list = store.get('exp', []);
    list.push({ id: Date.now(), desc: document.getElementById('e-desc').value.trim() || 'Spesa', amt, who: Number(document.getElementById('e-who').value), shared: document.getElementById('e-shared').checked, at: new Date().toISOString() });
    store.set('exp', list); route(); return;
  }
  const de = e.target.closest('[data-delexp]');
  if (de && confirm('Eliminare questa spesa?')) { store.set('exp', store.get('exp', []).filter((x) => x.id !== Number(de.dataset.delexp))); route(); }
});
document.addEventListener('change', async (e) => {
  const f = e.target;
  if (f.id === 'w-file' && f.files[0]) {
    const file = f.files[0], typed = document.getElementById('w-name').value.trim();
    const day = Number(document.getElementById('w-days').dataset.val) || 0;
    const pdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name);
    const say = (t) => { const st = document.getElementById('w-status'); if (st) st.textContent = t; };
    if (pdf) {
      try { await importPdf(file, typed || 'Biglietto', day, say); }
      catch (err) {
        alert('Non riesco a leggere il PDF (' + (err && err.message || 'errore') + '). Lo salvo così com’è.');
        await qrSet('w-' + Date.now(), { blob: file, label: typed || 'Biglietto', day, created: Date.now() });
      }
    } else {
      const label = typed || file.name.replace(/\.[^.]+$/, '') || 'Biglietto';
      say('Cerco il codice nello screenshot…');
      let ok = false;
      try { ok = await importImage(file, label, day); } catch (err) { ok = false; }
      if (!ok) await qrSet('w-' + Date.now(), { blob: file, label, day, created: Date.now() });
    }
    route(); return;
  }
  if (f.dataset.names != null) { const n = store.get('names', ['Persona 1', 'Persona 2']); n[Number(f.dataset.names)] = f.value.trim() || n[Number(f.dataset.names)]; store.set('names', n); route(); return; }
  if (f.dataset.budget != null) { store.set('budget', Number(String(f.value).replace(',', '.')) || 0); route(); }
});
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { location.replace(go.dataset.go); return; }
  const pb = e.target.closest('[data-planb]');
  if (pb) { store.set('planB', pb.dataset.planb === '1'); route(); return; }
});
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
route();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
