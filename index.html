<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vienna">
<meta name="robots" content="noindex">
<title>Vienna · 23–27 novembre</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap">
<style>
:root{
  --navy:#1C2233; --navy2:#2A3146; --cream:#F5EFE4; --card:#FBF8F2; --line:#E6DCC8;
  --gold:#D4AF5F; --gold-d:#8A6A22; --ink:#1C2233; --muted:#4A5060; --muted2:#6A6F7C;
  --c-viaggio:#2F5C8A; --c-visita:#8A6A22; --c-cibo:#9A4A1E; --c-serata:#8E2A2A; --ok:#2F6B3A;
  --serif:'Playfair Display',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh}
a{color:var(--gold-d)}
button{font:inherit}
img{display:block;max-width:100%}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--cream)}
main{flex:1;padding-bottom:calc(84px + var(--safe-b))}
.hdr{background:var(--navy);color:var(--cream);padding:calc(18px + var(--safe-t)) 18px 14px;display:flex;flex-direction:column;gap:12px}
.hdr-row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.kicker{margin:0;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700}
.h1{margin:4px 0 0;font-family:var(--serif);font-size:26px;line-height:1.15;font-weight:700}
.round{flex:none;width:44px;height:44px;border-radius:22px;background:var(--navy2);display:flex;align-items:center;justify-content:center;color:var(--gold);text-decoration:none}
.chips{display:flex;gap:6px}
.chip{flex:1;min-height:52px;border:none;border-radius:12px;background:var(--navy2);color:#E6E0D4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:6px 0}
.chip span{font-size:11px;font-weight:700;letter-spacing:1px}
.chip b{font-size:18px}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--navy)}
.content{padding:16px;display:flex;flex-direction:column;gap:10px}
.alert{background:#FBF3DC;border:1px solid #E3CF96;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4;color:#5C4610}
.toggle{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.toggle button{flex:1;min-height:44px;border:none;border-radius:10px;background:transparent;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--navy);color:var(--cream)}
.step{display:flex;gap:12px}
.step-time{width:48px;flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:14px}
.step-time b{font-size:13px}
.dot{width:10px;height:10px;border-radius:5px}
.card{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card img{width:100%;height:150px;object-fit:cover;border-radius:10px;background:#E6DCC8}
.kind{margin:0;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}
.card h2,.card h3{margin:0;font-size:16px;line-height:1.3;font-weight:700}
.note{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
.extra{margin:0;display:flex;flex-direction:column;gap:6px}
.extra img{width:100%;aspect-ratio:3/2;height:auto;object-fit:cover;border-radius:12px}
.extra figcaption{font-size:13px;color:var(--muted)}
.how{border:1px solid var(--line);border-radius:12px;background:#fff}
.how summary{list-style:none;cursor:pointer;min-height:44px;padding:0 12px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--c-viaggio)}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:'+';margin-left:auto;font-size:18px}
.how[open] summary::after{content:'–'}
.how ol{margin:0;padding:0 12px 12px;list-style:none;display:flex;flex-direction:column;gap:10px}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.how .line{flex:none;min-width:44px;padding:3px 6px;border-radius:6px;color:#fff;font-size:12px;font-weight:700;text-align:center}
.how small{display:block;color:var(--muted);font-size:13px}
.desc{margin:0;padding-left:10px;border-left:3px solid var(--gold);font-size:14px;line-height:1.5;color:var(--ink)}
.btn{align-self:flex-start;min-height:44px;padding:0 16px;border-radius:22px;background:var(--navy);color:var(--cream);font-size:14px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer}
.btn svg{flex:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.price{flex:none;font-size:15px;font-weight:700;color:var(--c-cibo)}
.meta{font-size:12px;font-weight:700;color:var(--gold-d);letter-spacing:.5px}
.linkcard{background:var(--navy);color:var(--cream);border-radius:14px;padding:14px 16px;text-decoration:none;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.linkcard small{display:block;color:#C9CDD8;font-size:12px;margin-top:2px}
.small{margin:0;font-size:12px;line-height:1.45;color:#5A6070}
/* home */
/* la home occupa esattamente lo schermo sopra la barra in basso: niente scroll, la foto si adatta */
.home{background:var(--navy);color:var(--cream);position:relative;overflow:hidden;height:calc(100vh - 84px - var(--safe-b));height:calc(100dvh - 84px - var(--safe-b))}
.home-inner{position:relative;height:100%;padding:calc(18px + var(--safe-t)) 18px 12px;display:flex;flex-direction:column;gap:12px}
.home h1{margin:0;font-family:var(--serif);font-size:46px;line-height:1;font-weight:700}
.home .sub{margin:2px 0 0;font-family:var(--serif);font-style:italic;font-size:17px;color:#DCD6CA}
.today{flex:1;min-height:0;background:var(--cream);color:var(--ink);border-radius:20px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:9px}
.today img{width:100%;flex:1 1 0;min-height:0;max-height:260px;object-fit:cover;border-radius:14px}
.badge{background:var(--navy);color:var(--gold);border-radius:12px;padding:4px 10px;font-size:12px;font-weight:700}
.today h2{margin:0;font-family:var(--serif);font-size:23px;line-height:1.15}
.tops{display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:9px}
.tops div{display:flex;gap:12px;align-items:baseline;font-size:14px;line-height:1.3}
.tops span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tops b{width:44px;flex:none;font-size:13px;color:var(--gold-d)}
.cta{flex:none;min-height:50px;border-radius:25px;background:var(--navy);color:var(--cream);text-decoration:none;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700}
.quick{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick a{min-height:60px;border-radius:16px;background:var(--navy2);color:var(--cream);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:700;text-align:center}
/* Safari con le barre aperte (iPhone 14/15 ≈ 660 px utili): tolgo il superfluo per lasciare spazio alla foto */
@media (max-height:720px){.home .sub,.tops div:nth-child(3){display:none}.home h1{font-size:40px}}
/* biglietti */
.prog{height:8px;border-radius:4px;background:var(--navy2);overflow:hidden}
.prog i{display:block;height:8px;border-radius:4px;background:var(--gold);transition:width .25s}
.tick{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid #B9AE98;background:#fff;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tick[aria-pressed="true"]{border-color:var(--ok);background:var(--ok)}
.done h3{color:#5A6070;text-decoration:line-through}
.ext{display:inline-flex;align-items:center;gap:6px;min-height:36px;font-size:14px;font-weight:700;color:var(--gold-d)}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(10px + var(--safe-b))}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs a{flex:1;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--muted2);font-size:11px;font-weight:500}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:700}
.sec{margin:6px 0 0;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-d);font-weight:700}
.info p{margin:0}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

<script>
// ---------- Dati del viaggio (verificati il 27–28/10/2026) ----------
const HOTEL = 'Albertgasse 48, 1080 Wien';
const COLORS = { viaggio: 'var(--c-viaggio)', visita: 'var(--c-visita)', cibo: 'var(--c-cibo)', serata: 'var(--c-serata)' };
const KIND = { viaggio: 'Spostamento', visita: 'Da vedere', cibo: 'Mangiare', serata: 'Sera' };

// s(ora, tipo, titolo, nota, destinazione per Maps, modo, foto, etichetta pulsante)
const s = (time, kind, title, note, dest, mode, img, label) => ({ time, kind, title, note, dest, mode: mode || 'transit', img, label });
// aggiunge a una tappa una breve descrizione storica (chiese e monumenti)
const about = (step, desc) => Object.assign(step, { desc });
// linee e fermate con i nomi ufficiali (Wiener Linien, ÖBB): leg(linea, da, a, dettagli)
const leg = (line, from, to, extra) => ({ line, from, to, extra });
const ride = (step, ...how) => Object.assign(step, { how });
// seconda foto di riferimento (es. il mercatino accanto al monumento)
const photo = (step, img, caption) => Object.assign(step, { more: { img, caption } });
const HOTEL_WALK = leg('A piedi', 'Alser Straße', 'Hotel Korotan', 'Circa 6 min lungo la Alser Straße e l’Albertgasse.');

const DAYS = [
  { n: 1, short: 'LUN', num: '23', label: 'Giorno 1 · lunedì 23 novembre', title: 'Arrivo e mercatino del Rathaus', heroImg: 'stephansdom',

    steps: [
      ride(s('11:40', 'viaggio', 'Dall’aeroporto all’hotel', 'Atterraggio a Vienna (VIE). REX 7 fino a Meidling, poi U6. Non prendete la S7: per i lavori arriva solo a St. Marx.', HOTEL, 'transit', 'aeroporto', 'Verso l’hotel'),
        leg('REX 7', 'Flughafen Wien', 'Wien Meidling', 'Direzione Mödling, 31 min. Esempio: partenza 12:16, arrivo 12:47. Vanno bene anche Railjet e IC per Meidling.'),
        leg('U6', 'Bahnhof Meidling', 'Alser Straße', 'Direzione Floridsdorf, 8 fermate.'),
        HOTEL_WALK),
      s('13:00', 'visita', 'Hotel Korotan: check-in o bagagli', HOTEL),
      s('13:30', 'cibo', 'Pranzo: Prinz Ferdinand', 'Mittagsmenü a 4 min a piedi. Schnitzel con zuppa ≈14,90 €.', 'Bennoplatz 2, 1080 Wien', 'walking', 'schnitzel'),
      ride(photo(about(s('15:00', 'visita', 'Stephansdom → Graben → Kohlmarkt → MQ', 'Tram 43 + bus 1A fino a Stephansplatz, poi tutto a piedi. Navata del Duomo gratis. Sulla piazza c’è già il mercatino Weihnachtsdorf Stephansplatz (11–21): artigianato austriaco e specialità tradizionali.', 'Stephansplatz, 1010 Wien', 'transit', 'stephansdom'),
        'Il Duomo di Santo Stefano è il simbolo di Vienna. È gotico, con la torre sud alta circa 136 m: in cima si arriva con 343 gradini. Le tegole colorate del tetto disegnano l’aquila bicipite degli Asburgo e gli stemmi di Vienna e dell’Austria. Nella torre nord c’è la Pummerin, la grande campana rifusa dopo l’incendio del 1945.'), 'mercatino-stephansplatz', 'Il mercatino Weihnachtsdorf Stephansplatz, accanto al Duomo'),
        leg('43', 'Skodagasse', 'Schottentor', 'Fermata sulla Alser Straße, 4 min dall’hotel. Direzione Schottentor, 3 fermate fino al capolinea.'),

    ]},
  { n: 2, short: 'MAR', num: '24', label: 'Giorno 2 · martedì 24 novembre', title: 'Sissi, Parlamento e Figlmüller', heroImg: 'belvedere',
    alert: 'Prenotati: Belvedere alle 16:00 · tavolo Figlmüller alle 21:30.',
    steps: [
      ride(s('10:00', 'visita', 'Hofburg: Sisi Museum e Appartamenti', 'Tram 2 fino a Burgring, poi 8 min a piedi attraverso l’Heldenplatz. Incluso nel Sisi Pass.', 'Sisi Museum, Michaelerplatz, 1010 Wien', 'transit', 'appartamenti'),
        leg('2', 'Albertgasse', 'Burgring', 'Fermata sulla Josefstädter Straße, 7 min dall’hotel. Direzione Friedrich-Engels-Platz, 4 fermate.'),
        leg('A piedi', 'Burgring', 'Michaelerplatz', 'Circa 8 min attraverso l’Heldenplatz e i cortili della Hofburg.')),
      s('13:00', 'cibo', 'Pranzo al Justizcafé', 'Ultimo piano del Palazzo di Giustizia, 14 min a piedi. Controllo di sicurezza, cucina 11–14:30.', 'Schmerlingplatz 11, 1010 Wien', 'walking', 'justiz'),
      s('14:00', 'visita', 'Parlamento, visita gratuita', '7 min a piedi. Serve un documento con foto.', 'Parlament, Dr.-Karl-Renner-Ring 3, 1010 Wien', 'walking', 'parlament'),
      ride(s('15:00', 'cibo', 'Caffè storico: Sacher o Demel', 'In tram dal Parlamento all’Opera.', 'Café Sacher, Philharmoniker Straße 4, 1010 Wien', 'transit', 'sachertorte'),
        leg('1 · 2 · D', 'Parlament, Volkstheater', 'Oper, Karlsplatz', 'Va bene uno qualsiasi di questi tram, 2 fermate. Il Sacher è dietro l’Opera.')),
      ride(s('16:00', 'visita', 'Belvedere Superiore · slot 16:00', 'Tram D fino a Schloss Belvedere. Il Bacio di Klimt. Chiude alle 18.', 'Oberes Belvedere, Prinz-Eugen-Straße 27, 1030 Wien', 'transit', 'belvedere'),
        leg('D', 'Oper, Karlsplatz', 'Schloss Belvedere', 'Direzione Absberggasse, 4 fermate. L’ingresso del museo è lì davanti.')),
      photo(about(s('18:00', 'serata', 'Karlskirche e mercatino Art Advent', '18 min a piedi, in discesa nei giardini.', 'Karlsplatz, 1040 Wien', 'walking', 'karlskirche'),

      ride(s('21:30', 'cibo', 'Tavolo da Figlmüller', 'U1 fino a Stephansplatz. La cucina chiude alle 22: ordina subito.', 'Figlmüller, Bäckerstraße 6, 1010 Wien', 'transit', 'schnitzel'),
        leg('U1', 'Karlsplatz', 'Stephansplatz', 'Direzione Leopoldau, 1 fermata, poi 5 min a piedi.'),
        leg('2', 'Stubentor', 'Albertgasse', 'Per tornare in hotel: 5 min a piedi fino a Stubentor, poi tram direzione Dornbach.'))
    ]},
  { n: 3, short: 'MER', num: '25', label: 'Giorno 3 · mercoledì 25 novembre', title: 'Schönbrunn, dal pomeriggio alla sera', heroImg: 'schoenbrunn',
    alert: 'Prenotato: palazzo di Schönbrunn alle 13:30. Tramonto alle 16:08.',

        leg('U4', 'Schönbrunn', 'Längenfeldgasse', 'Direzione Heiligenstadt, 2 fermate.'),
        leg('U6', 'Längenfeldgasse', 'Alser Straße', 'Direzione Floridsdorf, 6 fermate.'),

  { n: 4, short: 'GIO', num: '26', label: 'Giorno 4 · giovedì 26 novembre', title: 'Bratislava e musical', heroImg: 'castello-bratislava',

      ride(s('19:30', 'serata', 'Die Schöne und das Biest', 'Raimund Theater, Wallgasse 18–20. Kat. F. Fine ≈22:00.', 'Raimund Theater, Wallgasse 18, 1060 Wien', 'transit', 'raimund'),

        HOTEL_WALK)
    ],
    planB: {
      alert: 'Piano B se restate a Vienna. Klanglicht: prenota lo slot delle 17:00 (14,90 €).',

// Giorno del viaggio in base alla data (ora di Vienna): 0 = prima, 1–5 = durante, 6 = dopo
function tripDay() {
  const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Vienna', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  if (parts < '2026-11-23') return 0;
  if (parts > '2026-11-27') return 6;
  return Number(parts.slice(8, 10)) - 22;
}
function daysLeft() {
  const now = new Date(); const start = new Date('2026-11-23T00:00:00+01:00');
  return Math.max(0, Math.ceil((start - now) / 86400000));
}
const defaultDay = () => { const t = tripDay(); return t === 0 ? 1 : t === 6 ? 1 : t; };

function header(kicker, title, extra) {
  return `<header class="hdr"><div class="hdr-row"><div><p class="kicker">${esc(kicker)}</p><h1 class="h1">${esc(title)}</h1></div>
    <a class="round" href="${maps(HOTEL, 'transit')}" aria-label="Torna in hotel">${ICON.house}</a></div>${extra || ''}</header>`;
}
function chips(route, active) {
  return `<div class="chips" role="group" aria-label="Giorno">${DAYS.map((d) =>
    `<button class="chip" type="button" data-go="#/${route}/${d.n}" aria-pressed="${d.n === active}"><span>${d.short}</span><b>${d.num}</b></button>`).join('')}</div>`;
}
// colori ufficiali delle metro di Vienna; tram rossi, bus blu, treni grigio scuro, piedi oro
function lineColor(l) {
  const u = { U1: '#E3000F', U2: '#A862A4', U3: '#EE7D00', U4: '#319F49', U6: '#9D6930' };
  if (u[l]) return u[l];
  if (/^[\dD ·]+$/.test(l)) return '#C4161C';
  if (/A$|^Bus/.test(l)) return '#1F5FA8';
  if (l === 'A piedi') return 'var(--gold-d)';
  return '#3A3F4D';
}
function stepHtml(st) {
  const col = COLORS[st.kind];
  return `<div class="step"><div class="step-time"><b>${esc(st.time)}</b><span class="dot" style="background:${col}"></span></div>
    <article class="card">
      ${st.img ? `<img src="img/${st.img}.jpg" alt="${esc(st.title)}" loading="lazy" width="900" height="600">` : ''}
      <p class="kind" style="color:${col}">${KIND[st.kind]}</p>
      <h2>${esc(st.title)}</h2>
      ${st.note ? `<p class="note">${esc(st.note)}</p>` : ''}
      ${st.desc ? `<p class="desc">${esc(st.desc)}</p>` : ''}
      ${st.more ? `<figure class="extra"><img src="img/${st.more.img}.jpg" alt="${esc(st.more.caption)}" loading="lazy" width="900" height="600"><figcaption>${esc(st.more.caption)}</figcaption></figure>` : ''}
      ${st.how ? `<details class="how"><summary>${ICON.info}Linee e fermate</summary><ol>${st.how.map((g) => `<li>
        <span class="line" style="background:${lineColor(g.line)}">${esc(g.line)}</span>

      ${st.dest ? `<a class="btn" href="${maps(st.dest, st.mode)}" target="_blank" rel="noopener">${ICON.pin}${esc(st.label || (st.mode === 'walking' ? 'A piedi, portami lì' : 'Mezzi, portami lì'))}</a>` : ''}
    </article></div>`;
}

// ---------- Router ----------
const view = document.getElementById('view');
const tabs = document.getElementById('tabs');
function route() {
  const [, name, arg] = (location.hash || '#/').split('/');
  const n = Math.min(5, Math.max(1, Number(arg) || defaultDay()));
  let html, tab;
  if (name === 'giorno') { html = viewDay(n); tab = 'giorno'; }
  else if (name === 'mangiare') { html = viewFood(n); tab = 'mangiare'; }
  else if (name === 'biglietti') { html = viewTickets(); tab = 'biglietti'; }
  else if (name === 'info') { html = viewInfo(); tab = 'info'; }
  else { html = viewHome(); tab = 'home'; }
  document.body.style.background = tab === 'home' ? 'var(--navy)' : 'var(--cream)';
  view.innerHTML = html;
  const items = [['home', '#/', 'Inizio', ICON.tabHome], ['giorno', `#/giorno/${n}`, 'Giorno', ICON.tabDay], ['mangiare', `#/mangiare/${n}`, 'Mangiare', ICON.tabFood], ['biglietti', '#/biglietti', 'Biglietti', ICON.tabTicket], ['info', '#/info', 'Info', ICON.tabInfo]];
  tabs.innerHTML = items.map(([id, href, label, ic]) => `<a href="${href}"${id === tab ? ' aria-current="page"' : ''}>${ic}${label}</a>`).join('');
}
document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { location.replace(go.dataset.go); return; }
  const pb = e.target.closest('[data-planb]');
  if (pb) { store.set('planB', pb.dataset.planb === '1'); route(); return; }
  const tk = e.target.closest('[data-tick]');
  if (tk) { const d = store.get('done', {}); d[tk.dataset.tick] = !d[tk.dataset.tick]; store.set('done', d); route(); const b = document.querySelector(`[data-tick="${tk.dataset.tick}"]`); if (b) b.focus(); }
});
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
route();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
